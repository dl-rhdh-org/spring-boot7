apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: spring-demos
  description: System for spring-boot7 Spring Boot demo
spec:
  owner: group:default/devteam1
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: spring-boot7
  description: Spring Boot backend demo (build + deploy)
  annotations:
    github.com/project-slug: dl-rhdh-org/spring-boot7
    backstage.io/source-location: url:https://github.com/dl-rhdh-org/spring-boot7/tree/main
    backstage.io/kubernetes-id: spring-boot7
    backstage.io/kubernetes-namespace: spring-demos
    # Image Registry (Quay) tab — must match a Quay repo the plugin can read
    quay.io/repository-slug: openshifttest/hello-openshift
    argocd/app-name: spring-boot7
    argocd/app-namespace: openshift-gitops
    argocd/instance-name: main
    # url: form — scaffolder registers managed-by as /tree/.../catalog-info.yaml which breaks dir:.
    backstage.io/techdocs-ref: url:https://github.com/dl-rhdh-org/spring-boot7/tree/main
    servicenow.com/entity-id: spring-boot7
  tags:
    - spring-boot
    - java
    - maven
    - github-actions
    - demo
  links:
    - url: https://github.com/dl-rhdh-org/spring-boot7
      title: GitHub Repository
      icon: github
    - url: https://github.com/dl-rhdh-org/spring-boot7/actions
      title: GitHub Actions
      icon: github
    - url: https://openshift-gitops-server-openshift-gitops.apps.cluster-ldkv4.dyn.redhatworkshops.io/applications/spring-boot7
      title: Argo CD
      icon: dashboard
    - url: https://spring-boot7-spring-demos.apps.cluster-ldkv4.dyn.redhatworkshops.io
      title: OpenShift Route
      icon: web
      type: website
    - url: https://console-openshift-console.apps.cluster-ldkv4.dyn.redhatworkshops.io/k8s/cluster/projects/spring-demos
      title: OpenShift Project
      icon: catalog
    - url: https://quay.io/repository/openshifttest/hello-openshift
      title: Demo image (Quay)
      icon: catalog
    - url: https://devspaces.apps.cluster-ldkv4.dyn.redhatworkshops.io/#https://github.com/dl-rhdh-org/spring-boot7
      title: Open in Dev Spaces
      icon: catalog
spec:
  type: service
  lifecycle: experimental
  owner: group:default/devteam1
  system: spring-demos
